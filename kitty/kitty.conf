font_family Iosevka Term Extended
font_size 12.0
placement_strategy center

confirm_os_window_close 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_shape beam
map ctrl+shift+space kitten kitty_grab/grab.py
map ctrl+shift+h show_scrollback

enable_audio_bell no

clipboard_control write-clipboard write-primary read-clipboard read-primary

map ctrl+shift+left no_op
map ctrl+shift+right no_op
map ctrl+shift+home no_op
map ctrl+shift+end no_op

env EDITOR=micro

background              #1F1F1F
foreground              #FFFFFF

selection_background    #FB8C00
selection_foreground    #000000

cursor                  #FB8C00
cursor_text_color       #1F1F1F

url_color               #2196F3

active_border_color     #FB8C00
inactive_border_color   #3E3E3E
bell_border_color       #FDD633

tab_bar_background      #1F1F1F
tab_bar_margin_color    #1F1F1F
active_tab_background   #FB8C00
active_tab_foreground   #000000
inactive_tab_background #292929
inactive_tab_foreground #B3B3B3

color0   #1F1F1F
color8   #3E3E3E
color1   #F28B82
color9   #F28B82
color2   #81C995
color10  #81C995
color3   #FDD633
color11  #FDD633
color4   #2196F3
color12  #2196F3
color5   #CE93D8
color13  #CE93D8
color6   #80CBC4
color14  #80CBC4
color7   #FFFFFF
color15  #FFFFFF
