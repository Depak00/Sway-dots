gaps inner 5
gaps outer 5
# smart_gaps true

default_border pixel 2
# hide_edge_borders smart
default_floating_border pixel 2

client.focused          #b4befe #1e1e2e #cdd6f4 #f5e0dc #b4befe
client.focused_inactive #6c7086 #1e1e2e #cdd6f4 #f5e0dc #6c7086
client.unfocused        #6c7086 #1e1e2e #cdd6f4 #f5e0dc #6c7086
client.urgent           #fab387 #1e1e2e #fab387 #6c7086 #fab387

# Lavat on background
exec sh -c 'swaymsg focus output HDMI-A-1; exec windowtolayer -- kitty -e lavat -g -c b4befe -k b4befe -r 1'
exec sh -c 'sleep 2; swaymsg focus output eDP-1; exec windowtolayer -- kitty -e lavat -g -c b4befe -k b4befe -r 1'
