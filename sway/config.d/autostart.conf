exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland XDG_SESSION_DESKTOP=sway DISPLAY

exec kanshi

exec mako

exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec wl-clip-persist --clipboard regular

exec cliphist wipe
