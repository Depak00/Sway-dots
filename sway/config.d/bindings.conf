### Containers and workspaces

	floating_modifier $mod normal

	# Kill focused window
	bindsym --to-code $mod+q kill

	# Focus windows
	bindsym $mod+Left focus left
	bindsym $mod+Down focus down
	bindsym $mod+Up focus up
	bindsym $mod+Right focus right

	# Move windows
	bindsym $mod+shift+Left move left
	bindsym $mod+shift+Down move down
	bindsym $mod+shift+Up move up
	bindsym $mod+shift+Right move right

	# Switch to workspace
	bindsym $mod+1 workspace number 1
	bindsym $mod+2 workspace number 2
	bindsym $mod+3 workspace number 3
	bindsym $mod+4 workspace number 4
	bindsym $mod+5 workspace number 5
	bindsym $mod+6 workspace number 6
	bindsym $mod+7 workspace number 7
	bindsym $mod+8 workspace number 8
	bindsym $mod+9 workspace number 9
	bindsym $mod+0 workspace number 10

	# Move focused container to workspace
	bindsym $mod+shift+1 move container to workspace number 1
	bindsym $mod+shift+2 move container to workspace number 2
	bindsym $mod+shift+3 move container to workspace number 3
	bindsym $mod+shift+4 move container to workspace number 4
	bindsym $mod+shift+5 move container to workspace number 5
	bindsym $mod+shift+6 move container to workspace number 6
	bindsym $mod+shift+7 move container to workspace number 7
	bindsym $mod+shift+8 move container to workspace number 8
	bindsym $mod+shift+9 move container to workspace number 9
	bindsym $mod+shift+0 move container to workspace number 10

	# Moving to next/previous workspace
	bindsym $mod+alt+Right workspace next
	bindsym $mod+alt+Left workspace prev

	# Move focused container to next/previous workspace
	bindsym $mod+alt+shift+Right move container to workspace next
	bindsym $mod+alt+shift+Left move container to workspace prev

	# Moving to first/last workspace
	bindsym $mod+alt+Down exec swaymsg workspace $(swaymsg -t get_workspaces -r | jq -r '.[].num' | sort -n | head -1)
	bindsym $mod+alt+Up exec swaymsg workspace $(swaymsg -t get_workspaces -r | jq -r '.[].num' | sort -n | tail -1)

	# Move focused container to first/last workspace
	bindsym $mod+alt+shift+Down exec swaymsg move container to workspace $(swaymsg -t get_workspaces -r | jq -r '.[].num' | sort -n | head -1)
	bindsym $mod+alt+shift+Up exec swaymsg move container to workspace $(swaymsg -t get_workspaces -r | jq -r '.[].num' | sort -n | tail -1)

	# Fullscreen
	bindsym --to-code $mod+f fullscreen

	# Toggle floating mode
	bindsym $mod+shift+space floating toggle; resize set 800 600

	# Toggle focus between modes
	bindsym $mod+space focus mode_toggle

	# Scratchpad
	bindsym $mod+shift+minus move scratchpad
	bindsym $mod+minus scratchpad show

	# Resizing containers
	bindsym $mod+Ctrl+Left resize shrink width 10px
	bindsym $mod+Ctrl+Down resize grow height 10px
	bindsym $mod+Ctrl+Up resize shrink height 10px
	bindsym $mod+Ctrl+Right resize grow width 10px



### Fn keys

	# Brightness
	bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
	bindsym XF86MonBrightnessUp exec brightnessctl set 5%+

	# Volume
	bindsym XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
	bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
	bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%



### Screenshots

	# Fullscreen screenshot
	bindsym Print exec grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

	# Copy part of the screen
	bindsym shift+Print exec grim -g "$(slurp)" - | wl-copy

	# Save part of screen
	bindsym Ctrl+Print exec grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

	# Screenshot active window
	bindsym alt+Print exec swaymsg -t get_tree | jq -r '.. | select(.focused?) | .rect | "\(.x),\(.y) \(.width)x\(.height)"' | grim -g - ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png



### Launching apps

	# Start a terminal
	bindsym $mod+Return exec $term
	bindsym $mod+Shift+Return exec $term --class floating_term
	bindsym $mod+Ctrl+Return exec bash ~/.config/sway/slterm.sh

	# Start your launcher
	bindsym --to-code $mod+d exec "killall -q $menu_kill || exec $menu"
	
	# VPN
	bindsym --to-code $mod+a exec AmneziaVPN

	# Steam
	bindsym --to-code $mod+g exec steam
	bindsym --to-code $mod+shift+g exec ~/.local/bin/games

	# Browser
	bindsym --to-code $mod+w exec $browser
	bindsym --to-code $mod+shift+w exec $browser $private

	# File managers
	bindsym --to-code $mod+e exec $files
	bindsym --to-code $mod+shift+e exec kitty -e $tfiles

	# Clipboard manager
	bindsym --to-code $mod+v exec cliphist list | fuzzel -d -I --minimal-lines | cliphist decode | wl-copy
	bindsym --to-code $mod+Shift+v exec cliphist wipe

	# Swaylock
	bindsym --to-code $mod+l exec swaylock --color 000000 --ring-color ffffff --key-hl-color 000000 --ring-ver-color ffffff --inside-ver-color 000000 --inside-wrong-color 000000 --ring-wrong-color ff0000



### Sway keybinds

	# Reload the configuration file
	bindsym --to-code $mod+shift+c reload

	# Exit sway
	bindsym --to-code $mod+shift+x exec swaymsg exit
